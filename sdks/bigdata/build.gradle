plugins {
    id 'com.android.library'
    id 'kotlin-android'
}
android {
    namespace 'com.bigdata.lib'
    compileSdk rootProject.ext.version.compileSdk

    defaultConfig {
        minSdkVersion rootProject.ext.version.minSdk
        targetSdkVersion rootProject.ext.version.targetSdk
        versionCode 1
        versionName "1.0"

        consumerProguardFiles "proguard-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {

    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation project(path: ":sdks:util")
    implementation rootProject.ext.android.kotlin_stdlib
    implementation rootProject.ext.android.core_ktx
    implementation rootProject.ext.android.appcompat

    implementation rootProject.ext.other.aes
    implementation rootProject.ext.other.cache

    implementation rootProject.ext.retrofit.gson
    implementation rootProject.ext.retrofit.logging_interceptor
    implementation rootProject.ext.retrofit.okhttp

    //定位sdk
    api(rootProject.ext.location.location) {
        changing = true
        transitive = true
    }
}

apply from: '../../maven_push.gradle'
group = 'com.bigdata.lib'
version = '1.0.0'