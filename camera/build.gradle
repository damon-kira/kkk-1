plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.camera.lib'
    compileSdk rootProject.ext.version.compileSdk
    defaultConfig {
        minSdkVersion rootProject.ext.version.minSdk
        targetSdkVersion rootProject.ext.version.targetSdk
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(path: ":sdks:util")
    implementation rootProject.ext.android.kotlin_stdlib
    implementation rootProject.ext.android.appcompat

    api rootProject.ext.camera.core
    api rootProject.ext.camera.camera2
    api rootProject.ext.camera.lifecycle
    api rootProject.ext.camera.view
    api rootProject.ext.camera.extensions

}